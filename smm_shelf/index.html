<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abstract Goods Sort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen phone game — frosted HUD / glass cabinet of 4×10 shelves / glass booster tray.
   Single light "studio" look: lavender-grey haze, red glass, frosted white, chrome. */
:root{
  color-scheme:light;
  --bg-1:#f1f2f8;
  --bg-2:#d6d9e7;
  --ink:#1c1d2b;
  --muted:#6c6f86;
  --red:#ff1f3a;
  --red-deep:#e3122c;
  --coral:#ff8a6e;
  --lilac:#b8b2ff;
  --frost:rgba(255,255,255,.5);
  --frost-brd:rgba(255,255,255,.9);
  --shade:rgba(78,78,128,.16);
  --red-glass:linear-gradient(135deg,#ffa184 0%,#ff4b52 42%,#e8142c 100%);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(50% 35% at 10% 0%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(45% 30% at 100% 85%, rgba(255,31,58,.14), transparent 70%),
    radial-gradient(40% 30% at 0% 75%, rgba(184,178,255,.35), transparent 70%),
    linear-gradient(165deg,var(--bg-1),var(--bg-2));
  -webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;max-width:500px;margin:0 auto;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.32));
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--frost-brd);
  box-shadow:0 8px 24px var(--shade), inset 0 1px 0 #fff;
}
.redglass{
  background:var(--red-glass);color:#fff;border:1px solid rgba(255,255,255,.55);
  box-shadow:0 10px 24px rgba(232,20,44,.32), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -8px 16px rgba(160,0,20,.22);
}
/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.pill b{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.lv{justify-self:start}
.right{justify-self:end;display:flex;gap:8px;align-items:center}
.stars svg{width:15px;height:15px;fill:var(--red)}
.stars.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
.pause{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;cursor:pointer;padding:0}
.pause svg{width:13px;height:13px;fill:#fff}
.clock{display:flex;flex-direction:column;align-items:center;gap:6px}
.time{
  font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  padding:9px 16px 8px;border-radius:14px;transform:rotate(-2deg);transition:background .3s, box-shadow .3s;
}
.app.warn .time{animation:warn 1s infinite}
@keyframes warn{50%{box-shadow:0 0 0 4px rgba(255,31,58,.25), 0 10px 30px rgba(232,20,44,.6)}}
.app.frozen .time{background:linear-gradient(135deg,#e7e4ff,#a69dff 60%,#7d72f0);box-shadow:0 10px 24px rgba(125,114,240,.4), inset 0 1px 0 rgba(255,255,255,.7)}
.combo{position:relative;width:120px;height:15px;border-radius:999px;overflow:hidden}
.combo-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--red-glass)}
.combo span{position:relative;display:block;text-align:center;font-size:9px;line-height:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);mix-blend-mode:multiply}

/* Cabinet */
.cabinet{flex:0 0 auto;align-self:center;margin-block:auto;box-sizing:border-box;width:min(100%, calc((100dvh - 220px) / 1.36 + 16px));border-radius:22px;padding:8px;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(220,223,240,.22))!important}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.shelf{
  position:relative;container-type:size;aspect-ratio:1.5;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(214,217,234,.3));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 4px 10px rgba(78,78,128,.08), inset 0 -6px 12px rgba(120,120,170,.08);
  transition:box-shadow .15s;
}
.pane{ /* frosted pane between back layer and front row */
  position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  -webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
}
.shelf::after{ /* red glowing rim instead of a plank */
  content:"";position:absolute;left:8px;right:8px;bottom:5px;height:4px;border-radius:3px;z-index:4;
  background:linear-gradient(90deg,var(--coral),var(--red));box-shadow:0 0 7px rgba(255,31,58,.55);
}
.shelf.hover{box-shadow:inset 0 0 0 2px var(--red), 0 0 16px rgba(255,31,58,.35)}
.shelf.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.slots{position:absolute;left:4%;right:4%;top:6%;bottom:14%;display:grid;grid-template-columns:repeat(3,1fr);gap:4%}
.slot{position:relative}
.slot img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);user-select:none;-webkit-user-drag:none;pointer-events:none}
.slot img.it{max-width:94%;max-height:100%;width:auto;height:auto;z-index:3;pointer-events:auto;cursor:grab;filter:drop-shadow(0 5px 4px rgba(70,60,120,.28));transition:transform .14s, filter .14s}
.slot img.back{width:min(112%, 60cqh);bottom:30%;z-index:1;opacity:.75;filter:saturate(.7)}
.slot img.it.sel{transform:translateX(-50%) translateY(-14%) scale(1.08);filter:drop-shadow(0 0 6px rgba(255,31,58,.7)) drop-shadow(0 8px 5px rgba(70,60,120,.3))}
.slot img.it.lift{transform:translateX(-50%) scale(1.08)}
.slot img.it.hint{animation:hint .7s ease-in-out infinite}
@keyframes hint{50%{transform:translateX(-50%) translateY(-12%);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 6px var(--red))}}
.pips{position:absolute;top:2px;right:6px;z-index:4;font:800 9px var(--f-body);color:var(--muted)}
.stamp{
  position:absolute;inset:24% 14% 28%;z-index:4;display:grid;place-items:center;border-radius:8px;
  font-family:var(--f-display);font-weight:800;font-size:min(15px, 15cqh);letter-spacing:.03em;
  transform:rotate(-7deg) scale(.6);opacity:0;pointer-events:none;transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);
}
.shelf.sold .stamp{opacity:.95;transform:rotate(-7deg) scale(1)}

/* Boosters */
.boosters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bst{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;cursor:pointer;
  border-radius:16px;color:var(--ink);font:600 11px var(--f-body);transition:transform .1s, opacity .2s;
}
.bst:active{transform:scale(.95)}
.bst:disabled{opacity:.4;cursor:default}
.bst svg{width:24px;height:24px}
.bst .cnt{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:7px;font:800 10px/20px var(--f-display);text-align:center;transform:rotate(-6deg)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.ghost{position:fixed;pointer-events:none;z-index:60;filter:drop-shadow(0 14px 10px rgba(70,60,120,.3))}
.spark{position:fixed;width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor}
.ring{position:fixed;width:20px;height:20px;border-radius:50%;border:2px solid var(--red);box-shadow:0 0 14px rgba(255,31,58,.5)}
.float{position:fixed;font:800 17px var(--f-display);color:var(--red);text-shadow:0 0 8px #fff,0 2px 0 #fff;white-space:nowrap}

/* Modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(214,217,231,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:24px}
.card{width:min(320px,100%);text-align:center;padding:26px 22px 22px;border-radius:24px}
.card h2{margin:0 0 8px;font:800 22px/1.15 var(--f-display);text-wrap:balance;color:var(--ink)}
.card p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.45}
.card .row{display:flex;flex-direction:column;gap:8px}
.btn{height:46px;border-radius:14px;font:800 15px var(--f-body);color:var(--ink);cursor:pointer;border:1px solid var(--frost-brd);background:rgba(255,255,255,.6)}
.btn.primary{background:var(--red-glass);color:#fff;border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 24px rgba(232,20,44,.3), inset 0 1px 0 rgba(255,255,255,.6)}
.loading{position:fixed;inset:0;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--muted);z-index:90;background:var(--bg-1)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="pill lv glass">Lv. <b id="lv">23</b></div>
    <div class="clock">
      <div class="time redglass" id="time">04:00</div>
      <div class="combo glass"><div class="combo-fill" id="comboFill"></div><span id="comboTxt">Combo x0</span></div>
    </div>
    <div class="right">
      <div class="pill stars glass" id="starsPill"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><b id="stars">0</b></div>
      <button class="pause redglass" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1.2"/><rect x="8.5" y="1" width="3.5" height="12" rx="1.2"/></svg></button>
    </div>
  </header>
  <main class="cabinet glass"><div class="board" id="board"></div></main>
  <footer class="boosters">
    <button class="bst glass" data-b="hint"><svg viewBox="0 0 24 24" fill="#ff1f3a"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg><span class="cnt redglass">3</span>Подсказка</button>
    <button class="bst glass" data-b="magnet"><svg viewBox="0 0 24 24"><path d="M5 3h5v8a2 2 0 004 0V3h5v8a7 7 0 01-14 0z" fill="#ff1f3a"/><path d="M5 3h5v4H5zM14 3h5v4h-5z" fill="#c9ccdb"/></svg><span class="cnt redglass">2</span>Магнит</button>
    <button class="bst glass" data-b="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="#ff1f3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span class="cnt redglass">2</span>Микс</button>
    <button class="bst glass" data-b="freeze"><svg viewBox="0 0 24 24" fill="none" stroke="#7d72f0" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 3 3-3M9 20l3-3 3 3"/></svg><span class="cnt redglass">2</span>Заморозка</button>
  </footer>
</div>
<div id="fx"></div>
<div class="modal" id="modal" hidden><div class="card glass" id="card"></div></div>
<div class="loading" id="loading">Рендерим стекло…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(async () => {
const TYPES = [
  {n:'Плашка 5G',   c:['#ff8a6e','#ff1f3a']},
  {n:'Кнопка',      c:['#ffffff','#ff2238']},
  {n:'Тумблер',     c:['#dfe1ee','#ff2238']},
  {n:'Сфера',       c:['#ffa184','#e8142c']},
  {n:'Кольцо',      c:['#ff6a5a','#d80f2a']},
  {n:'Wi-Fi',       c:['#ffffff','#ff2238']},
  {n:'Монета',      c:['#ff8a6e','#e8142c']},
  {n:'Куб',         c:['#ffffff','#b8b2ff']},
  {n:'Капсула',     c:['#ffc2ad','#ff3346']},
  {n:'Арка',        c:['#ff5a4e','#c40d26']},
  {n:'Хром',        c:['#eceef6','#ff2238']},
];
let SPR = [];

/* ---------- 3D glass sprites ---------- */
function makeSprites(){
  const S = 320;
  const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
  r.setPixelRatio(1); r.setSize(S,S); r.setClearColor(0x000000,0);
  r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.NoToneMapping;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30,1,.1,30); cam.position.set(0,.15,4.2); cam.lookAt(0,0,0);
  const lin = h => new THREE.Color(h).convertSRGBToLinear();

  // light studio env: lavender haze, white softboxes, a red bounce
  const c = document.createElement('canvas'); c.width=512; c.height=256; const g=c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#f7f8fd'); gr.addColorStop(.5,'#d7daea'); gr.addColorStop(1,'#a9adc6');
  g.fillStyle=gr; g.fillRect(0,0,512,256);
  g.filter='blur(10px)';
  g.fillStyle='#ffffff'; g.fillRect(40,20,170,60); g.fillRect(290,40,110,40); g.fillRect(150,150,200,26);
  g.fillStyle='#ff2a3d'; g.beginPath(); g.ellipse(450,170,60,34,0,0,7); g.fill();
  g.fillStyle='#ff6a5a'; g.fillRect(0,200,90,40);
  g.fillStyle='#b8b2ff'; g.beginPath(); g.arc(250,230,40,0,7); g.fill();
  const tex = new THREE.CanvasTexture(c); tex.mapping = THREE.EquirectangularReflectionMapping; tex.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromEquirectangular(tex).texture;
  scene.add(new THREE.HemisphereLight(0xffffff,0xb8b2ff,.55));
  const dl = new THREE.DirectionalLight(0xffffff,1.0); dl.position.set(-3,4,4); scene.add(dl);
  const pl = new THREE.PointLight(0xff2a3d,1.4,10); pl.position.set(2.5,-2,1.5); scene.add(pl);

  // materials
  const redGlass = () => new THREE.MeshPhysicalMaterial({vertexColors:true, roughness:.12, metalness:0, clearcoat:1, clearcoatRoughness:.04, transparent:true, opacity:.93, envMapIntensity:.65, emissive:lin('#ff1f3a'), emissiveIntensity:.18});
  const frost = (col='#e6e8f2', op=.95) => new THREE.MeshPhysicalMaterial({color:lin(col), roughness:.32, clearcoat:.8, clearcoatRoughness:.15, transparent:true, opacity:op, envMapIntensity:.85});
  const lilac = () => new THREE.MeshPhysicalMaterial({vertexColors:true, roughness:.18, clearcoat:1, clearcoatRoughness:.06, transparent:true, opacity:.8, envMapIntensity:1.1});
  const chrome = () => new THREE.MeshPhysicalMaterial({color:lin('#eef0f8'), metalness:1, roughness:.1, envMapIntensity:1.4});
  const rim = () => new THREE.MeshPhysicalMaterial({color:lin('#ff2238'), emissive:lin('#ff1530'), emissiveIntensity:.6, roughness:.2, clearcoat:1});

  // geometry helpers
  const grad = (geo,a,b,mode='diag') => {
    geo.computeBoundingBox(); const bb=geo.boundingBox, p=geo.attributes.position;
    const ca=lin(a), cb=lin(b), tmp=new THREE.Color(), col=new Float32Array(p.count*3);
    const span = mode==='diag' ? (bb.max.y-bb.min.y)+(bb.max.x-bb.min.x) : (bb.max.y-bb.min.y);
    for(let k=0;k<p.count;k++){
      const v = mode==='diag' ? (p.getY(k)-bb.min.y)+(bb.max.x-p.getX(k)) : (p.getY(k)-bb.min.y);
      tmp.copy(cb).lerp(ca, Math.min(1,Math.max(0,v/(span||1)))); col[k*3]=tmp.r; col[k*3+1]=tmp.g; col[k*3+2]=tmp.b;
    }
    geo.setAttribute('color',new THREE.BufferAttribute(col,3)); return geo;
  };
  const rr = (w,h,rad) => { const s=new THREE.Shape(), x=-w/2, y=-h/2;
    s.moveTo(x+rad,y); s.lineTo(x+w-rad,y); s.quadraticCurveTo(x+w,y,x+w,y+rad); s.lineTo(x+w,y+h-rad); s.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
    s.lineTo(x+rad,y+h); s.quadraticCurveTo(x,y+h,x,y+h-rad); s.lineTo(x,y+rad); s.quadraticCurveTo(x,y,x+rad,y); return s; };
  const tileGeo = (w,h,rad,d) => { const q=new THREE.ExtrudeGeometry(rr(w,h,rad),{depth:d,bevelEnabled:true,bevelThickness:.07,bevelSize:.07,bevelSegments:6,curveSegments:20}); q.translate(0,0,-d/2); return q; };
  const lathe = (fn,n=80) => { const p=[]; for(let i=0;i<=n;i++){ const [x,y]=fn(i/n); p.push(new THREE.Vector2(Math.max(x,1e-4),y)); } return new THREE.LatheGeometry(p,72); };
  const discGeo = (R,h,b=.12) => { const q=lathe(t=>{ // rounded coin profile, face toward +z after rotation
      if(t<.3) return [ (t/.3)*(R-b), -h/2 ];
      if(t<.7){ const a=-Math.PI/2+((t-.3)/.4)*Math.PI; return [R-b+b*Math.cos(a), (h/2)*Math.sin(a)]; }
      return [ (1-(t-.7)/.3)*(R-b), h/2 ]; },90); q.rotateX(Math.PI/2); return q; };
  const capsuleGeo = (R,hl) => lathe(t=>{
      if(t<1/3){ const a=-Math.PI/2+t*3*Math.PI/2; return [R*Math.cos(a),-hl+R*Math.sin(a)]; }
      if(t<2/3) return [R,-hl+(t-1/3)*3*2*hl];
      const a=(t-2/3)*3*Math.PI/2; return [R*Math.cos(a),hl+R*Math.sin(a)]; },90);
  const glyph = fn => { const cv=document.createElement('canvas'); cv.width=cv.height=256; fn(cv.getContext('2d')); const t=new THREE.CanvasTexture(cv); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; };
  const decal = (t,size,z) => { const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size), new THREE.MeshStandardMaterial({map:t,transparent:true,roughness:.35,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.3,depthWrite:false})); m.position.z=z+.004; m.renderOrder=5; return m; };
  const glass = (geo,mat) => { const grp=new THREE.Group(); const back=new THREE.Mesh(geo,mat.clone()); back.material.side=THREE.BackSide; back.renderOrder=1; const front=new THREE.Mesh(geo,mat); front.renderOrder=2; grp.add(back,front); return grp; };

  const G = {
    five: glyph(x=>{ x.fillStyle='#fff'; x.font='800 104px Unbounded, "Arial Black", sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('5G',128,136); }),
    globe: glyph(x=>{ x.fillStyle='#ff2238'; x.beginPath(); x.arc(128,128,92,0,7); x.fill(); x.globalCompositeOperation='destination-out'; x.lineWidth=15;
      x.beginPath(); x.ellipse(128,128,38,92,.35,0,7); x.stroke(); x.beginPath(); x.moveTo(30,150); x.lineTo(226,106); x.stroke(); }),
    wifi: glyph(x=>{ x.strokeStyle='#ff2238'; x.lineCap='round'; x.lineWidth=24; [44,88,132].forEach(R=>{ x.beginPath(); x.arc(128,200,R,-Math.PI*.78,-Math.PI*.22); x.stroke(); }); x.fillStyle='#ff2238'; x.beginPath(); x.arc(128,200,16,0,7); x.fill(); }),
    bars: glyph(x=>{ x.fillStyle='#fff'; [60,95,130,165].forEach((h,i)=>{ const X=50+i*44, Y=210-h; x.beginPath(); x.roundRect ? x.roundRect(X,Y,30,h,8) : x.rect(X,Y,30,h); x.fill(); }); }),
  };

  const build = [
    () => { const grp=new THREE.Group(); grp.add(glass(grad(tileGeo(1.55,1.55,.36,.14),'#ff8a6e','#e3122c'),redGlass())); grp.add(decal(G.five,1.3,.14)); grp.rotation.set(-.28,.5,.12); return grp; },
    () => { const grp=new THREE.Group(); grp.add(new THREE.Mesh(discGeo(1,.34),frost('#e4e6f1',1))); const t=new THREE.Mesh(new THREE.TorusGeometry(.95,.06,16,120),rim()); t.position.z=.12; grp.add(t); grp.add(decal(G.globe,1.35,.17)); grp.rotation.set(-.45,.4,0); return grp; },
    () => { const grp=new THREE.Group(); const body=capsuleGeo(.5,.62); body.rotateZ(Math.PI/2); grp.add(glass(body,frost('#e6e8f4',.78)));
            const k=new THREE.Group(); k.add(new THREE.Mesh(discGeo(.4,.18,.07),frost('#f7f8fc',1))); const t=new THREE.Mesh(new THREE.TorusGeometry(.38,.035,12,80),rim()); t.position.z=.06; k.add(t); k.position.set(.6,0,.42); grp.add(k);
            grp.rotation.set(-.4,.45,.28); return grp; },
    () => glass(grad(new THREE.SphereGeometry(1,64,48),'#ff9a7e','#e3122c'),redGlass()),
    () => { const grp=glass(grad(new THREE.TorusGeometry(1,.36,48,110),'#ff8a6e','#d80f2a'),redGlass()); grp.rotation.set(-1.0,.35,0); return grp; },
    () => { const grp=new THREE.Group(); grp.add(glass(tileGeo(1.5,1.5,.36,.14),frost('#eef0f7',.95))); grp.add(decal(G.wifi,1.25,.14)); grp.rotation.set(-.3,-.48,-.1); return grp; },
    () => { const grp=new THREE.Group(); grp.add(glass(grad(discGeo(1,.36),'#ffa184','#e3122c'),redGlass())); grp.add(decal(G.bars,1.25,.18)); grp.rotation.set(-.4,-.5,.1); return grp; },
    () => { const grp=glass(grad(tileGeo(1.15,1.15,.3,.9),'#ffffff','#a59dff','y'),lilac()); grp.rotation.set(.5,.7,0); return grp; },
    () => { const grp=glass(grad(capsuleGeo(.48,.6),'#ffc2ad','#ff2f45','y'),redGlass()); grp.rotation.set(.2,0,.55); return grp; },
    () => { const grp=glass(grad(new THREE.TorusGeometry(1,.34,40,90,Math.PI),'#ff7a5c','#c40d26'),redGlass()); grp.rotation.set(-.15,.5,0); return grp; },
    () => { const grp=new THREE.Group(); grp.add(new THREE.Mesh(new THREE.TorusGeometry(1,.26,40,110),chrome())); const t=new THREE.Mesh(new THREE.TorusGeometry(.72,.06,16,100),rim()); grp.add(t); grp.rotation.set(-.95,.3,0); return grp; },
  ];

  const trim = src => { const cv=document.createElement('canvas'); cv.width=src.width; cv.height=src.height; const x=cv.getContext('2d'); x.drawImage(src,0,0);
    const d=x.getImageData(0,0,cv.width,cv.height).data; let x0=cv.width,y0=cv.height,x1=0,y1=0;
    for(let y=0;y<cv.height;y++) for(let X=0;X<cv.width;X++) if(d[(y*cv.width+X)*4+3]>10){ if(X<x0)x0=X; if(X>x1)x1=X; if(y<y0)y0=y; if(y>y1)y1=y; }
    if(x1<=x0) return cv.toDataURL(); const pad=3; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(cv.width-1,x1+pad); y1=Math.min(cv.height-1,y1+pad);
    const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height); return o.toDataURL('image/png'); };
  const out = [];
  build.forEach(fn => {
    const obj = fn(); const wrap=new THREE.Group(); wrap.add(obj); wrap.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(wrap), sph=box.getBoundingSphere(new THREE.Sphere());
    obj.position.sub(sph.center); const s=1/(sph.radius*.9); wrap.scale.setScalar(s);
    scene.add(wrap); r.render(scene,cam); out.push(trim(r.domElement)); scene.remove(wrap);
  });
  r.dispose();
  return out;
}
function fallbackSprites(){
  return TYPES.map((T,i) => { const c=document.createElement('canvas'); c.width=c.height=160; const g=c.getContext('2d');
    const gr=g.createLinearGradient(20,20,140,140); gr.addColorStop(0,T.c[0]); gr.addColorStop(1,T.c[1]);
    g.fillStyle=gr; g.beginPath(); g.arc(80,80,64,0,7); g.fill(); g.fillStyle='rgba(255,255,255,.9)'; g.font='bold 54px sans-serif'; g.textAlign='center'; g.fillText('●▲■◆✦✚⬢⬟◐◑★'[i],80,98); return c.toDataURL(); });
}

/* ---------- state ---------- */
const COLS=3, ROWS=6, N=COLS*ROWS, TIME=240, COMBO_T=7;
const $ = id => document.getElementById(id);
const board=$('board'), fx=$('fx'), app=$('app');
let shelves=[], shelfEls=[], level=23, stars=0, timeLeft=TIME, started=false, paused=false, over=false,
    freezeLeft=0, combo=0, comboLeft=0, boosts, sel=null, drag=null;

const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const frontEmpty = sh => sh.layers[0].every(v=>v==null);

function generate(){
  const order = shuffle([...TYPES.keys()]);
  const pool = [];
  order.forEach((t,ix) => { const c = ix<9 ? 6 : 3; for(let k=0;k<c;k++) pool.push(t); }); // 60 = 20 triples
  shuffle(pool);
  const FRONT = 40, front = pool.slice(0,FRONT), back = pool.slice(FRONT);
  shelves = Array.from({length:N}, () => ({layers:[[null,null,null]], cleared:false, busy:false}));
  const fc = Array(N).fill(2); shuffle([...Array(N).keys()]).slice(0,FRONT-2*N).forEach(i=>fc[i]=3);
  let k=0; shelves.forEach((sh,i) => shuffle([0,1,2]).slice(0,fc[i]).forEach(s => sh.layers[0][s]=front[k++]));
  let b=0;
  while(b<back.length){
    const c = shelves.filter(s=>s.layers.length<3); const sh = c[rnd(c.length)];
    const size = Math.min(back.length-b, 2+rnd(2)); const L=[null,null,null];
    shuffle([0,1,2]).slice(0,size).forEach(s => L[s]=back[b++]); sh.layers.push(L);
  }
  for(let guard=0; guard<500; guard++){ // no pre-made triples
    let bad=null; shelves.forEach(sh=>sh.layers.forEach(L=>{ if(L[0]!=null&&L[0]===L[1]&&L[1]===L[2]) bad=L; }));
    if(!bad) break;
    const o = shelves[rnd(N)].layers[0]; const s = [0,1,2].find(x=>o[x]!=null&&o[x]!==bad[0]);
    if(s!=null){ [bad[0],o[s]]=[o[s],bad[0]]; }
  }
}

/* ---------- render ---------- */
function img(t,cls){ const im=new Image(); im.src=SPR[t]; im.className=cls; im.draggable=false; im.alt=TYPES[t].n; return im; }
function buildBoard(){
  board.textContent='';
  shelfEls = shelves.map((sh,i) => {
    const el=document.createElement('div'); el.className='shelf'; el.dataset.i=i;
    el.innerHTML='<div class="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div class="stamp redglass">SOLD OUT</div>';
    board.appendChild(el); return el;
  });
  shelves.forEach((_,i)=>renderShelf(i));
}
function renderShelf(i, opt={}){
  const sh=shelves[i], el=shelfEls[i], slots=el.querySelectorAll('.slot');
  slots.forEach((slot,s) => {
    slot.textContent='';
    const ft = sh.layers[0][s];
    if(ft!=null){
      const im=img(ft,'it'); im.dataset.i=i; im.dataset.s=s;
      if(sel && sel.i===i && sel.s===s) im.classList.add('sel');
      slot.appendChild(im);
      if(opt.rise) im.animate([{transform:'translateX(-50%) scale(.4)',opacity:0},{transform:'translateX(-50%)',opacity:1}],{duration:320,easing:'cubic-bezier(.2,.9,.3,1.25)'});
      if(opt.spin) im.animate([{transform:'translateX(-50%) scale(.2) rotate(-180deg)',opacity:0},{transform:'translateX(-50%)',opacity:1}],{duration:380,delay:rnd(160),easing:'cubic-bezier(.2,.9,.3,1.2)',fill:'backwards'});
    }
  });
  el.classList.toggle('sold', sh.cleared && sh.layers.length===1 && frontEmpty(sh));
  
}
const itemEl = (i,s) => shelfEls[i].querySelectorAll('.slot')[s].querySelector('img.it');

/* ---------- interaction ---------- */
function setSel(i,s){ clearSel(); sel={i,s}; const e=itemEl(i,s); e && e.classList.add('sel'); }
function clearSel(){ if(sel){ const e=itemEl(sel.i,sel.s); e && e.classList.remove('sel'); } sel=null; }
function makeGhost(el){ const r=el.getBoundingClientRect(); const g=new Image(); g.src=el.src; g.className='ghost'; Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'}); fx.appendChild(g); return g; }
function shake(j){ const e=shelfEls[j]; e.classList.remove('nope'); void e.offsetWidth; e.classList.add('nope'); }
let hoverEl=null;
function setHover(el){ if(hoverEl===el) return; hoverEl && hoverEl.classList.remove('hover'); hoverEl=el; el && el.classList.add('hover'); }
const shelfAt = (x,y) => { const e=document.elementFromPoint(x,y); return e ? e.closest('.shelf') : null; };

board.addEventListener('pointerdown', e => {
  if(over||paused) return;
  const it=e.target.closest('img.it'), shEl=e.target.closest('.shelf');
  if(!it){ if(sel && shEl){ tapMove(+shEl.dataset.i, e.clientX); } else clearSel(); return; }
  const i=+it.dataset.i, s=+it.dataset.s; if(shelves[i].busy) return;
  e.preventDefault();
  drag={i,s,x0:e.clientX,y0:e.clientY,moved:false,el:it,ghost:null,id:e.pointerId};
  it.classList.add('lift');
});
window.addEventListener('pointermove', e => {
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>6){
    drag.moved=true; clearSel(); drag.el.classList.remove('lift'); drag.ghost=makeGhost(drag.el); drag.el.style.visibility='hidden';
    drag.w=parseFloat(drag.ghost.style.width)*1.15; drag.ghost.style.width=drag.w+'px';
  }
  if(drag.moved){
    drag.ghost.style.left=(e.clientX-drag.w/2)+'px'; drag.ghost.style.top=(e.clientY-drag.w*.8)+'px';
    setHover(shelfAt(e.clientX,e.clientY));
  }
});
function endDrag(e, cancel){
  if(!drag||e.pointerId!==drag.id) return;
  const d=drag; drag=null; d.el.classList.remove('lift'); setHover(null);
  if(!d.moved){
    if(cancel) return;
    if(sel && sel.i===d.i && sel.s===d.s){ clearSel(); return; }
    if(sel && sel.i!==d.i){ tapMove(d.i, e.clientX); return; }
    setSel(d.i,d.s); return;
  }
  const t = cancel ? null : shelfAt(e.clientX,e.clientY);
  const ok = t && move(d.i,d.s,+t.dataset.i,e.clientX,d.ghost,d.el);
  if(!ok){
    if(t) shake(+t.dataset.i);
    const r=d.el.getBoundingClientRect();
    d.ghost.animate([{},{left:r.left+'px',top:r.top+'px',width:r.width+'px'}],{duration:180,easing:'ease-out',fill:'forwards'})
      .onfinish=()=>{ d.ghost.remove(); d.el.style.visibility=''; };
  }
}
window.addEventListener('pointerup', e=>endDrag(e,false));
window.addEventListener('pointercancel', e=>endDrag(e,true));

function tapMove(j,x){
  const {i,s}=sel; const src=itemEl(i,s); clearSel();
  if(i===j) return;
  if(!move(i,s,j,x,null,src)) shake(j);
}

function move(i,s,j,x,ghost,src){
  const A=shelves[i], B=shelves[j];
  if(A.busy||B.busy) return false;
  const free=[0,1,2].filter(k=>B.layers[0][k]==null || (i===j && k===s));
  if(!free.length) return false;
  const sl=shelfEls[j].querySelectorAll('.slot');
  let best=free[0], bd=1e9;
  free.forEach(k=>{ const r=sl[k].getBoundingClientRect(); const dd=Math.abs(r.left+r.width/2-x); if(dd<bd){bd=dd;best=k;} });
  if(!ghost) ghost=makeGhost(src);
  const t=A.layers[0][s];
  A.layers[0][s]=null; B.layers[0][best]=t;
  if(!started) started=true;
  renderShelf(i); if(j!==i) renderShelf(j);
  const dst=itemEl(j,best); dst.style.visibility='hidden';
  const r=dst.getBoundingClientRect(); B.busy=true;
  ghost.animate([{},{left:r.left+'px',top:r.top+'px',width:r.width+'px'}],{duration:170,easing:'cubic-bezier(.3,.8,.3,1)',fill:'forwards'})
    .onfinish=()=>{
      ghost.remove(); dst.style.visibility=''; B.busy=false;
      dst.animate([{transform:'translateX(-50%) scaleY(.82) scaleX(1.12)'},{transform:'translateX(-50%)'}],{duration:200,easing:'cubic-bezier(.3,1.6,.5,1)'});
      checkMatch(j);
      if(i!==j) promote(i);
    };
  return true;
}

function checkMatch(j){
  const B=shelves[j], f=B.layers[0];
  if(B.busy || f[0]==null || f[0]!==f[1] || f[1]!==f[2]) return false;
  B.busy=true; const t=f[0];
  const ims=[0,1,2].map(s=>itemEl(j,s)); const m=ims[1].getBoundingClientRect();
  ims.forEach(im=>{ const r=im.getBoundingClientRect(); const dx=m.left-r.left;
    im.animate([{transform:'translateX(-50%)'},{transform:`translateX(calc(-50% + ${dx*.5}px)) translateY(-18%) scale(1.2)`,offset:.55},{transform:`translateX(calc(-50% + ${dx}px)) translateY(-14%) scale(.15)`,opacity:0}],{duration:360,easing:'ease-in',fill:'forwards'}); });
  setTimeout(()=>{
    const cx=m.left+m.width/2, cy=m.top+m.height*.4;
    burst(cx,cy,TYPES[t].c);
    B.layers[0]=[null,null,null]; B.cleared=true; B.busy=false;
    score(cx,cy);
    promote(j); checkWin();
  },330);
  return true;
}
function promote(j){
  const B=shelves[j]; if(B.busy) return;
  if(!frontEmpty(B)){ renderShelf(j); return; }
  if(B.layers.length>1){ B.layers.shift(); renderShelf(j,{rise:true}); setTimeout(()=>checkMatch(j),330); }
  else renderShelf(j);
}
function score(x,y){
  combo = comboLeft>0 ? combo+1 : 1; comboLeft=COMBO_T; stars+=combo;
  const p=$('starsPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');
  const f=document.createElement('div'); f.className='float'; f.textContent = combo>1 ? `+${combo} ★  x${combo}` : '+1 ★';
  f.style.left=x+'px'; f.style.top=y+'px'; fx.appendChild(f);
  f.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-110%) scale(1.1)',opacity:1,offset:.25},{transform:'translate(-50%,-260%) scale(1)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>f.remove();
}
function burst(x,y,cols){
  const ring=document.createElement('i'); ring.className='ring'; ring.style.left=x+'px'; ring.style.top=y+'px'; fx.appendChild(ring);
  ring.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:'translate(-50%,-50%) scale(4)',opacity:0}],{duration:500,easing:'ease-out'}).onfinish=()=>ring.remove();
  const pal=[cols[0],cols[1],'#ff1f3a','#ffffff'];
  for(let n=0;n<18;n++){
    const d=document.createElement('i'); d.className='spark'; const c=pal[n%4]; d.style.background=c; d.style.color=c==='#ffffff'?'#ff8a6e':c;
    d.style.left=x+'px'; d.style.top=y+'px'; fx.appendChild(d);
    const a=Math.random()*Math.PI*2, R=28+Math.random()*55;
    d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*R}px),calc(-50% + ${Math.sin(a)*R}px)) scale(.15)`,opacity:0}],{duration:550+Math.random()*350,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=()=>d.remove();
  }
}

/* ---------- boosters ---------- */
function frontByType(){
  const m=new Map();
  shelves.forEach((sh,i)=>{ if(sh.busy) return; sh.layers[0].forEach((t,s)=>{ if(t!=null){ if(!m.has(t)) m.set(t,[]); m.get(t).push({i,s}); } }); });
  return m;
}
const B = {
  hint(){
    const m=frontByType(); let best=null;
    m.forEach(v=>{ if(!best || v.length>best.length) best=v; });
    if(!best) return false;
    best.slice(0,3).forEach(({i,s})=>{ const e=itemEl(i,s); if(e){ e.classList.add('hint'); setTimeout(()=>e.classList.remove('hint'),2400); } });
    return true;
  },
  magnet(){
    const m=frontByType(); let bt=null, bl=0; m.forEach((v,t)=>{ if(v.length>bl){bl=v.length; bt=t;} });
    if(bt==null) return false;
    const picks=m.get(bt).slice(0,3);
    if(picks.length<3){
      for(let i=0;i<N && picks.length<3;i++){ const sh=shelves[i]; if(sh.busy) continue;
        for(let l=1;l<sh.layers.length && picks.length<3;l++) for(let s=0;s<3 && picks.length<3;s++) if(sh.layers[l][s]===bt) picks.push({i,s,l}); }
    }
    if(picks.length<3) return false;
    started=true;
    const br=board.getBoundingClientRect(), cx=br.left+br.width/2, cy=br.top+br.height/2;
    const touched=new Set();
    picks.forEach(p=>{ touched.add(p.i); shelves[p.i].busy=true;
      if(!p.l){ const e=itemEl(p.i,p.s); const g=makeGhost(e); e.style.visibility='hidden';
        g.animate([{},{left:(cx-20)+'px',top:(cy-20)+'px',width:'40px',opacity:.2}],{duration:420,easing:'cubic-bezier(.5,0,.7,.4)',fill:'forwards'}).onfinish=()=>g.remove(); }
    });
    setTimeout(()=>{
      picks.forEach(p=>{ shelves[p.i].layers[p.l||0][p.s]=null; });
      touched.forEach(i=>{ const sh=shelves[i]; sh.layers=sh.layers.filter((L,ix)=>ix===0||L.some(v=>v!=null)); sh.busy=false; if(frontEmpty(sh)) sh.cleared=true; });
      burst(cx,cy,TYPES[bt].c); score(cx,cy);
      touched.forEach(i=>promote(i)); checkWin();
    },430);
    return true;
  },
  shuffle(){
    const pos=[], ts=[];
    shelves.forEach((sh,i)=>{ if(sh.busy) return; sh.layers[0].forEach((t,s)=>{ if(t!=null){ pos.push({i,s}); ts.push(t); } }); });
    if(ts.length<2) return false;
    started=true; clearSel(); shuffle(ts);
    pos.forEach((p,k)=>shelves[p.i].layers[0][p.s]=ts[k]);
    shelves.forEach((_,i)=>renderShelf(i,{spin:true}));
    setTimeout(()=>shelves.forEach((_,i)=>checkMatch(i)),450);
    return true;
  },
  freeze(){ if(freezeLeft>0) return false; started=true; freezeLeft=10; return true; },
};
document.querySelectorAll('.bst').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.b; if(over||paused||!boosts[k]) return;
  if(B[k]()){ boosts[k]--; syncBoosts(); }
}));
function syncBoosts(){ document.querySelectorAll('.bst').forEach(b=>{ const k=b.dataset.b; b.querySelector('.cnt').textContent=boosts[k]; b.disabled=!boosts[k]; }); }

/* ---------- flow ---------- */
function checkWin(){
  if(over) return;
  if(shelves.every(sh=>sh.layers.length===1 && frontEmpty(sh) && !sh.busy)){
    over=true;
    const used=TIME-timeLeft, mm=Math.floor(used/60), ss=Math.floor(used%60);
    setTimeout(()=>modal(`Уровень ${level} пройден`, `Все полки распроданы за ${mm}:${String(ss).padStart(2,'0')}. Звёзд: ${stars}.`,
      [{l:'Следующий уровень',p:1,f:()=>{ level++; newGame(); }}]),600);
  }
}
function lose(){
  over=true; let left=0; shelves.forEach(sh=>sh.layers.forEach(L=>L.forEach(v=>{ if(v!=null) left++; })));
  modal('Время вышло', `На полках осталось ${left} фигур. Попробуй ещё раз: бустеры восстановятся.`, [{l:'Заново',p:1,f:newGame}]);
}
function modal(title,text,btns){
  const card=$('card'); card.innerHTML=`<h2></h2><p></p><div class="row"></div>`;
  card.querySelector('h2').textContent=title; card.querySelector('p').textContent=text;
  btns.forEach(b=>{ const el=document.createElement('button'); el.className='btn'+(b.p?' primary':''); el.textContent=b.l; el.onclick=()=>{ $('modal').hidden=true; b.f(); }; card.querySelector('.row').appendChild(el); });
  $('modal').hidden=false; card.querySelector('.btn').focus();
}
$('pauseBtn').onclick=()=>{ if(over) return; paused=true;
  modal('Пауза', 'Таймер стоит. Тяни фигуры между полками: три одинаковые на одной полке сгорают.', [
    {l:'Продолжить',p:1,f:()=>{ paused=false; }},
    {l:'Начать уровень заново',f:()=>{ paused=false; newGame(); }} ]); };

function newGame(){
  generate(); timeLeft=TIME; started=false; paused=false; over=false; freezeLeft=0; combo=0; comboLeft=0; sel=null;
  boosts={hint:3,magnet:2,shuffle:2,freeze:2}; syncBoosts(); $('lv').textContent=level; buildBoard();
}
let last=performance.now();
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(started && !paused && !over){
    if(freezeLeft>0) freezeLeft=Math.max(0,freezeLeft-dt); else timeLeft-=dt;
    if(comboLeft>0){ comboLeft-=dt; if(comboLeft<=0){ comboLeft=0; combo=0; } }
    if(timeLeft<=0){ timeLeft=0; lose(); }
  }
  const t=Math.ceil(timeLeft); $('time').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  app.classList.toggle('frozen',freezeLeft>0); app.classList.toggle('warn',timeLeft<20 && freezeLeft<=0 && !over);
  $('comboFill').style.width=(comboLeft/COMBO_T*100)+'%'; $('comboTxt').textContent=`Combo x${combo}`; $('stars').textContent=stars;
  requestAnimationFrame(tick);
}

try { await Promise.race([document.fonts.load('800 104px Unbounded'), new Promise(r=>setTimeout(r,1500))]); } catch(e){}
try { SPR = (window.THREE ? makeSprites() : fallbackSprites()); } catch(err){ console.warn(err); SPR = fallbackSprites(); }
newGame(); $('loading').hidden=true; requestAnimationFrame(tick);
})();
</script>
